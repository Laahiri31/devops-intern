name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Files
        run: ls -la

      - name: Build Successful
        run: echo "Application Build Completed"

      - name: Deployment Successful
        run: echo "Application Deployment Completed"
